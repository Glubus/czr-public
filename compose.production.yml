services:
  web:
    environment:
      BODY_SIZE_LIMIT: 16M

  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      APP_ENV: production
      BETTER_AUTH_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      DOCS_TOKEN: ${DOCS_TOKEN:?DOCS_TOKEN is required}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      EMAIL_MODE: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}

  migrate:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}

  worker:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}

  caddy:
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:?CADDY_ADDRESS is required}
    ports: !override
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"

  redis:
    ports: !reset []

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: !reset []

  postgres-test:
    profiles: ["test"]
    ports: !reset []
