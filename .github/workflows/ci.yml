name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: docker compose up -d postgres postgres-test redis
      - run: deno task check
      - run: deno lint
      - run: deno task text:check
      - run: deno task test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run check && npm run lint && npm test && npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: browser-e2e-auth-secret-at-least-32-characters
      DOCS_TOKEN: browser-e2e-docs-token-at-least-32-characters
      PUBLIC_BASE_URL: http://localhost:8888
      FRONTEND_URL: http://localhost:8888
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build
      - name: Wait for the public stack
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8888/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api web caddy migrate
          exit 1
      - working-directory: web
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - if: always()
        run: docker compose down --volumes --remove-orphans

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke-compose.sh
